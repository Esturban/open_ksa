name: CI

on:
  pull_request:
    branches: [dev, master, main]
  push:
    branches: [dev]

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e ".[test]" 2>/dev/null || pip install -e . 2>/dev/null || true
          fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Pinned: an unpinned `pip install ruff` drifts CI's lint results away from what
          # passes locally as ruff ships new default rules (OPS-2378 caught this: 165 CI
          # errors against a commit that lints clean locally on this exact version).
          pip install ruff==0.12.12 pytest 2>/dev/null || true

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest --tb=short -q
          else
            echo "No tests found — skipping (add tests to enforce this step)"
          fi
