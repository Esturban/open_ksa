name: Sync Trunk to Dev

# dev -> trunk promotion is a squash merge, which leaves `dev` one commit
# behind trunk forever after ("master^N DIVERGED"). This job closes that gap by
# opening a trunk -> dev PR after every push to trunk (master/main).
#
# EV's hard rule: this job only ever OPENS a PR. It never merges, fast-forwards,
# or lands `dev` in CI -- EV reviews and merges the sync PR manually, full stop.

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-trunk-to-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open trunk -> dev sync PR (never auto-merged -- EV reviews manually)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWER: Esturban
        run: |
          set -euo pipefail
          BR="${GITHUB_REF_NAME}"
          ACTOR="${GITHUB_ACTOR:-}"

          # Loop guard: pushes made with the default GITHUB_TOKEN don't normally
          # re-trigger workflows, but guard explicitly anyway (e.g. if a PAT is
          # ever swapped in) and never act on our own bot's commits.
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "Push actor is github-actions[bot] -- skipping to avoid a retrigger loop."; exit 0
          fi

          if ! git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            echo "No dev branch on origin -- nothing to sync."; exit 0
          fi

          git fetch origin dev "$BR" --quiet

          # Nothing to sync if dev already contains everything on trunk (the
          # common case: this job just merged its own prior sync PR).
          if [ -z "$(git rev-list "origin/dev..origin/$BR" 2>/dev/null || true)" ]; then
            echo "dev is already up to date with $BR -- skipping."; exit 0
          fi

          SYNC_BRANCH="sync/${BR}-to-dev"
          git checkout -B "$SYNC_BRANCH" "origin/$BR"
          git push origin "$SYNC_BRANCH" --force-with-lease

          # Already open? Just ensure EV is the reviewer -- NEVER merge it here.
          if gh pr view "$SYNC_BRANCH" --json number >/dev/null 2>&1; then
            echo "Sync PR already open for $SYNC_BRANCH -- (re)requesting reviewer $REVIEWER"
            gh pr edit "$SYNC_BRANCH" --add-reviewer "$REVIEWER" 2>/dev/null \
              || gh pr edit "$SYNC_BRANCH" --add-assignee "$REVIEWER" 2>/dev/null || true
            exit 0
          fi

          gh pr create \
            --base dev --head "$SYNC_BRANCH" \
            --title "sync: $BR -> dev [skip ci]" \
            --body "Auto-opened by the \`Sync Trunk to Dev\` action after a push to \`$BR\`. This keeps \`dev\` from drifting behind trunk after a squash-merge promotion. **This PR is opened for manual review only -- it is never auto-merged, fast-forwarded, or landed by CI.** \`$REVIEWER\` requested as reviewer." \
            --reviewer "$REVIEWER" \
            || gh pr create --base dev --head "$SYNC_BRANCH" \
                 --title "sync: $BR -> dev [skip ci]" \
                 --body "Auto-opened by the \`Sync Trunk to Dev\` action after a push to \`$BR\`. This keeps \`dev\` from drifting behind trunk after a squash-merge promotion. **This PR is opened for manual review only -- it is never auto-merged, fast-forwarded, or landed by CI.** \`$REVIEWER\` requested as reviewer." \
                 --assignee "$REVIEWER"
